<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">Camera mesh — one photo, two scheduled hops</title>
  <desc id="description">Concept timing diagram covering 30 seconds. A PIR event at 2 seconds wakes camera 09 to capture and queue a photo. Its radio remains off until the 10-second window, when the photo is handed to solar relay 08. The relay holds it until its next forwarding window, around 20 seconds, then sends it to the always-on cabin base for microSD storage and phone notification. Camera check-ins repeat every 10 seconds; the relay has separate receive and transmit slots. The nominal 200-millisecond idle listen windows are enlarged for visibility, and photo transfer durations are omitted. Two percent is the camera's target idle listening duty cycle, not its total radio energy or airtime during uploads. The base assigns wake windows and clocks resynchronize on contact. Timing is illustrative, not measured performance.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
      .ink { fill: #eef1e9; }
      .muted { fill: #a6b5ae; }
      .quiet { fill: #81948a; }
      .green { fill: #9adbb3; }
      .blue { fill: #a5c5ee; }
      .amber { fill: #dfbd7c; }
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size: 14px; letter-spacing: 1.4px; }
      .label { font-size: 23px; font-weight: 600; letter-spacing: -.45px; }
      .body { font-size: 19px; }
      .small { font-size: 17px; }
      .transfer { fill: none; stroke: #91d4ab; stroke-width: 3; stroke-linecap: round; marker-end: url(#transfer-arrow); }
      .waiting { fill: none; stroke: #dfbd7c; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 3 7; }
      .off { stroke: #415349; stroke-width: 5; stroke-linecap: round; }
    </style>
    <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#17231f"/><stop offset="1" stop-color="#111b18"/></linearGradient>
    <linearGradient id="housing" x2="1" y2="1"><stop stop-color="#617260"/><stop offset="1" stop-color="#3b4e3e"/></linearGradient>
    <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#416c70"/><stop offset=".5" stop-color="#1c383c"/><stop offset="1" stop-color="#0e211f"/></linearGradient>
    <linearGradient id="base-strip"><stop stop-color="#263e41"/><stop offset="1" stop-color="#294a40"/></linearGradient>
    <marker id="transfer-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#91d4ab" stroke-width="1.5" stroke-linejoin="round"/></marker>
    <!-- Shared visual vocabulary with build.svg; all artwork is native vector. -->
    <g id="camera-icon">
      <path d="M31-29V1" stroke="#b4c5b5" stroke-width="4" stroke-linecap="round"/>
      <rect x="-3" y="11" width="68" height="42" rx="5" fill="#233629"/>
      <rect width="62" height="78" rx="10" fill="url(#housing)" stroke="#a3b39c" stroke-width="1.5"/>
      <path d="M8 8h46M9 69h44" stroke="#83957b" stroke-width="1.5"/>
      <circle cx="31" cy="29" r="18" fill="#20332a" stroke="#8fa68d" stroke-width="1.5"/>
      <circle cx="31" cy="29" r="12" fill="url(#glass)" stroke="#142922" stroke-width="3"/>
      <circle cx="27" cy="25" r="3.5" fill="#afdcd5" opacity=".6"/>
      <rect x="18" y="54" width="26" height="11" rx="5" fill="#bfccae"/>
      <path d="M24 56v7m7-7v7m7-7v7" stroke="#66795e"/>
      <circle cx="50" cy="12" r="2.4" fill="#a8df9c"/>
    </g>
    <g id="relay-icon">
      <path d="M29-25V0m-10-20h20" fill="none" stroke="#b4c5b5" stroke-width="3" stroke-linecap="round"/>
      <rect width="58" height="60" rx="8" fill="url(#housing)" stroke="#a3b39c" stroke-width="1.5"/>
      <path d="M11 32h21m-21 8h13" stroke="#9fb28e" stroke-width="2" stroke-linecap="round"/>
      <circle cx="44" cy="14" r="3" fill="#a8df9c"/>
    </g>
    <g id="base-icon">
      <rect width="60" height="76" rx="7" fill="#203a2d" stroke="#a1c3a6" stroke-width="2"/>
      <path d="M15-17V0m30-17V0" stroke="#b4c5b5" stroke-width="3" stroke-linecap="round"/>
      <path d="M12 20h36m-36 8h36m-36 8h24" stroke="#658f70" stroke-width="2"/>
      <rect x="12" y="53" width="16" height="10" rx="2" fill="#8fa98c"/>
      <circle cx="45" cy="59" r="3" fill="#b7e49b"/>
    </g>
    <g id="photo">
      <rect x="-17" y="-16" width="34" height="32" rx="7" fill="#d8b574" stroke="#f0d5a1" stroke-width="1.5"/>
      <rect x="-10" y="-10" width="20" height="20" rx="2" fill="#3f4931"/>
      <path d="m-8 8 5-8 6 6 3-4 3 6" fill="#d8c695"/><circle cx="5" cy="-5" r="2.5" fill="#e5dba9"/>
    </g>
    <g id="camera-slot"><rect x="-16" y="-26" width="32" height="52" rx="9" fill="#91d4ab" opacity=".08"/><rect x="-7" y="-18" width="14" height="36" rx="4" fill="#9adbb3"/></g>
    <g id="relay-slots"><rect x="-17" y="-26" width="62" height="52" rx="9" fill="#91d4ab" opacity=".08"/><rect x="-7" y="-18" width="14" height="36" rx="4" fill="#9adbb3"/><rect x="21" y="-18" width="14" height="36" rx="4" fill="#547c62" stroke="#9adbb3" stroke-width="1.5"/></g>
  </defs>

  <rect width="1600" height="1000" rx="24" fill="url(#paper)"/>
  <rect x=".75" y=".75" width="1598.5" height="998.5" rx="24" fill="none" stroke="#304036" stroke-width="1.5"/>

  <g id="heading">
    <text x="64" y="58" class="mono green">ORIGIN89 / CAMERA MESH</text>
    <text x="64" y="117" class="ink" font-size="46" font-weight="600" letter-spacing="-1.7">One photo. Two scheduled hops.</text>
    <text x="64" y="158" class="muted" font-size="21">A 30-second example of capture, waiting and delivery through the relay.</text>
    <rect x="1386" y="41" width="150" height="32" rx="16" fill="#26382b" stroke="#465c44"/>
    <circle cx="1406" cy="57" r="3.5" fill="#abc992"/>
    <text x="1462" y="62" text-anchor="middle" class="mono" fill="#c5d5bc">CONCEPT</text>
    <text x="1536" y="147" text-anchor="end" class="mono quiet">WAKE SCHEDULE / 02</text>
    <path d="M64 194H1536" stroke="#34463a"/>
  </g>

  <g id="time-axis" aria-label="Time in seconds: zero, ten, twenty and thirty">
    <text x="64" y="257" class="mono muted">NODE / POWER</text>
    <text x="336" y="257" text-anchor="middle" class="body muted">0 s</text>
    <text x="720" y="257" text-anchor="middle" class="body ink">10 s</text>
    <text x="1104" y="257" text-anchor="middle" class="body ink">20 s</text>
    <text x="1488" y="257" text-anchor="middle" class="body muted">30 s</text>
    <path d="M336 281V696m384-415v415m384-415v415m384-415v415" stroke="#3b4e41" stroke-width="1.3" stroke-dasharray="3 7"/>
    <path d="M528 281V696m384-415v415m384-415v415" stroke="#273a2e" stroke-width="1" stroke-dasharray="2 8"/>
    <path d="M336 275H1520" stroke="#3b4e41" stroke-width="1.3"/>
  </g>

  <g id="node-labels">
    <use xlink:href="#camera-icon" transform="translate(72 325) scale(.64)"/>
    <text x="135" y="349" class="label ink">Camera 09</text>
    <text x="135" y="378" class="body muted">Battery</text>
    <use xlink:href="#relay-icon" transform="translate(74 496) scale(.64)"/>
    <text x="135" y="514" class="label ink">Relay 08</text>
    <text x="135" y="543" class="body muted">Solar · RX / TX</text>
    <use xlink:href="#base-icon" transform="translate(73 637) scale(.64)"/>
    <text x="135" y="658" class="label ink">Cabin base</text>
    <text x="135" y="687" class="body muted">12 V bank</text>
  </g>

  <g id="radio-state" aria-label="Camera and relay sleep between wake windows; the base stays on">
    <path d="M336 358H1520M336 518H1520" class="off"/>
    <rect x="336" y="640" width="1184" height="40" rx="9" fill="url(#base-strip)" stroke="#779f9a" stroke-width="1.5"/>
    <text x="369" y="667" class="body blue" font-weight="500">Always awake · master clock</text>
    <use xlink:href="#camera-slot" x="720" y="358"/>
    <use xlink:href="#camera-slot" x="1104" y="358"/>
    <use xlink:href="#camera-slot" x="1488" y="358"/>
    <use xlink:href="#relay-slots" x="720" y="518"/>
    <use xlink:href="#relay-slots" x="1104" y="518"/>
    <use xlink:href="#relay-slots" x="1488" y="518"/>
    <text x="1120" y="326" text-anchor="middle" class="small green">~200 ms check-in</text>
    <text x="1293" y="392" text-anchor="middle" class="small muted">Radio off between windows</text>
    <text x="336" y="716" class="body muted">Keeps time · assigns wake windows · buffers photos on microSD</text>
  </g>

  <!-- The diagram shows the order of scheduled hand-offs, not packet airtime.
       Wake slots are deliberately enlarged; paired relay slots are separated
       visually so receive and transmit remain distinguishable at README size. -->
  <g id="capture" aria-label="At two seconds the camera captures a photo, queues it and turns its radio off">
    <path d="M432 358H702" class="waiting"/>
    <use xlink:href="#photo" x="412.8" y="358"/>
    <path d="M412.8 337v-17" stroke="#dfbd7c" stroke-width="1.5"/>
    <text x="412.8" y="309" class="body amber" font-weight="600">2 s · PIR event</text>
    <text x="565" y="395" text-anchor="middle" class="body amber">Queued · radio off</text>
  </g>

  <g id="first-hop" aria-label="At the ten-second window the camera hands the photo to the relay">
    <path d="M720 379V494" class="transfer"/>
    <circle cx="753" cy="433" r="13" fill="#91d4ab"/>
    <text x="753" y="439" text-anchor="middle" font-size="16" font-weight="700" fill="#16271d">1</text>
    <text x="780" y="430" class="label green">Camera → relay</text>
    <text x="780" y="459" class="body muted">Send at the next window</text>
  </g>

  <g id="relay-buffer" aria-label="The relay holds the photo with its radio off until the next forwarding window">
    <path d="M768 518H1085" class="waiting"/>
    <use xlink:href="#photo" x="816" y="518"/>
    <text x="922" y="558" text-anchor="middle" class="body amber">Held on relay · radio off</text>
  </g>

  <g id="second-hop" aria-label="At the next forwarding window, around twenty seconds, the relay hands the photo to the base">
    <path d="M1132 539V635" class="transfer"/>
    <circle cx="1167" cy="584" r="13" fill="#91d4ab"/>
    <text x="1167" y="590" text-anchor="middle" font-size="16" font-weight="700" fill="#16271d">2</text>
    <text x="1195" y="582" class="label green">Relay → base</text>
    <text x="1195" y="610" class="body muted">Forward at the next window</text>
    <use xlink:href="#photo" x="1132" y="660"/>
    <text x="1166" y="667" class="body ink" font-weight="500">Store · notify phone</text>
  </g>

  <g id="timing-notes">
    <path d="M64 750H1536" stroke="#34463a"/>
    <text x="64" y="790" class="mono green">01 / SHORT CHECK-INS</text>
    <text x="64" y="833" class="ink" font-size="30" font-weight="500" letter-spacing="-.8">200 ms every 10 s</text>
    <text x="64" y="862" class="body muted">≈2% target idle listen duty per camera.</text>
    <path d="M532 780v84" stroke="#34463a"/>
    <text x="564" y="790" class="mono green">02 / WAIT, THEN FORWARD</text>
    <text x="564" y="833" class="ink" font-size="30" font-weight="500" letter-spacing="-.8">2 s → 10 s → 20 s</text>
    <text x="564" y="862" class="body muted">Capture → relay window → base window.</text>
    <path d="M1041 780v84" stroke="#34463a"/>
    <text x="1073" y="790" class="mono green">03 / ONE SHARED CLOCK</text>
    <text x="1073" y="833" class="ink" font-size="28" font-weight="500" letter-spacing="-.8">Resync at every contact</text>
    <text x="1073" y="862" class="body muted">Only the base stays awake continuously.</text>
  </g>

  <g id="legend">
    <path d="M64 895H1536" stroke="#34463a"/>
    <path d="M64 930h42" class="off"/><text x="126" y="937" class="body muted">Radio off</text>
    <path d="M346 930h42" class="waiting"/><text x="408" y="937" class="body muted">Photo waiting</text>
    <rect x="687" y="919" width="13" height="22" rx="3" fill="#9adbb3"/><text x="720" y="937" class="body muted">Radio awake</text>
    <rect x="1014" y="922" width="42" height="16" rx="4" fill="#294a40" stroke="#779f9a"/><text x="1076" y="937" class="body muted">Base always on</text>
    <text x="1536" y="936" text-anchor="end" class="mono quiet">ORIGIN89</text>
    <text x="64" y="978" class="small quiet">Concept timing. Wake slots enlarged; transfer durations omitted. Uploads add airtime beyond the idle listening budget.</text>
  </g>
</svg>
