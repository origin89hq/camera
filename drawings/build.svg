<svg font-family="IBM Plex Mono, Menlo, monospace" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-label="How the mesh is built: a far camera behind a ridge reaches the cabin through a solar relay, a near camera reaches the mast directly, the base stores photos and hands them to the phone locally or over the cabin's backhaul, and the controller is an optional reader of the base's readings"><rect width="100%" height="100%" rx="10" fill="#0d1116"/>
      <defs>
        <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a96a3"/></marker>
        <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3fb47a"/></marker>
        <marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5c6873"/></marker>
      </defs>
      <!-- ground and the ridge that forces the relay -->
      <line x1="20" y1="330" x2="880" y2="330" stroke="#232c36" stroke-width="1.5"/>
      <path d="M150,330 C200,250 260,230 320,330 Z" fill="#131920" stroke="#232c36" stroke-width="1.5"/>
      <text x="235" y="300" fill="#5c6873" font-size="10.5" text-anchor="middle">ridge</text>
      <text x="235" y="314" fill="#5c6873" font-size="10.5" text-anchor="middle">no line of sight</text>

      <!-- far camera, battery, behind the ridge -->
      <rect x="28" y="222" width="108" height="66" rx="8" fill="#131920" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="82" y="246" fill="#e8ecf1" font-size="12.5" text-anchor="middle">camera 09</text>
      <text x="82" y="263" fill="#8a96a3" font-size="10.5" text-anchor="middle">PIR · battery</text>
      <text x="82" y="278" fill="#8a96a3" font-size="10.5" text-anchor="middle">98 % asleep</text>
      <line x1="82" y1="222" x2="82" y2="196" stroke="#8a96a3" stroke-width="1.5"/>
      <line x1="72" y1="200" x2="92" y2="200" stroke="#8a96a3" stroke-width="1.5"/>

      <!-- relay, solar, on the ridge's far side -->
      <rect x="352" y="196" width="118" height="66" rx="8" fill="#131920" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="411" y="220" fill="#e8ecf1" font-size="12.5" text-anchor="middle">relay 08</text>
      <text x="411" y="237" fill="#8a96a3" font-size="10.5" text-anchor="middle">solar · same board</text>
      <text x="411" y="252" fill="#8a96a3" font-size="10.5" text-anchor="middle">receives, keeps, forwards</text>
      <line x1="411" y1="196" x2="411" y2="170" stroke="#8a96a3" stroke-width="1.5"/>
      <line x1="401" y1="174" x2="421" y2="174" stroke="#8a96a3" stroke-width="1.5"/>
      <rect x="440" y="178" width="26" height="14" rx="2" fill="#1a3a2a" stroke="#3fb47a" stroke-width="1"/>
      <text x="453" y="172" fill="#3fb47a" font-size="9.5" text-anchor="middle">5 W</text>

      <!-- near camera, direct to the mast -->
      <rect x="352" y="60" width="108" height="56" rx="8" fill="#131920" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="406" y="84" fill="#e8ecf1" font-size="12.5" text-anchor="middle">camera 01</text>
      <text x="406" y="101" fill="#8a96a3" font-size="10.5" text-anchor="middle">in sight of the mast</text>

      <!-- the mast and the base at the cabin -->
      <line x1="620" y1="330" x2="620" y2="44" stroke="#8a96a3" stroke-width="2"/>
      <line x1="600" y1="50" x2="640" y2="50" stroke="#8a96a3" stroke-width="2"/>
      <circle cx="620" cy="44" r="4" fill="#3fb47a"/>
      <text x="632" y="70" fill="#5c6873" font-size="10.5">mast 6–8 m</text>
      <text x="632" y="84" fill="#5c6873" font-size="10.5">1–2 km radius</text>
      <rect x="560" y="200" width="128" height="88" rx="8" fill="#131920" stroke="#04653a" stroke-width="2"/>
      <text x="624" y="222" fill="#e8ecf1" font-size="12.5" text-anchor="middle">base — the cabin</text>
      <text x="624" y="240" fill="#8a96a3" font-size="10.5" text-anchor="middle">HaLow AP · master clock · MCU</text>
      <text x="624" y="255" fill="#8a96a3" font-size="10.5" text-anchor="middle">microSD buffer · cloud bridge</text>
      <text x="624" y="272" fill="#3fb47a" font-size="10.5" text-anchor="middle">the only node awake</text>
      <rect x="560" y="300" width="128" height="24" rx="5" fill="#131920" stroke="#232c36" stroke-width="1.5"/>
      <text x="624" y="316" fill="#8a96a3" font-size="10.5" text-anchor="middle">12 V bank</text>

      <!-- the controller: optional, readings only -->
      <rect x="560" y="356" width="128" height="44" rx="8" fill="#131920" stroke="#232c36" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="624" y="374" fill="#8a96a3" font-size="11.5" text-anchor="middle">km 43 controller</text>
      <text x="624" y="390" fill="#5c6873" font-size="10" text-anchor="middle">optional</text>
      <line x1="624" y1="288" x2="624" y2="300" stroke="#232c36" stroke-width="1.5"/>
      <path d="M624,324 L624,354" stroke="#5c6873" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#ahd)"/>
      <text x="636" y="344" fill="#5c6873" font-size="10">readings only</text>

      <!-- phones and backhaul -->
      <rect x="760" y="120" width="112" height="46" rx="8" fill="#131920" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="816" y="140" fill="#e8ecf1" font-size="12" text-anchor="middle">phone</text>
      <text x="816" y="156" fill="#8a96a3" font-size="10.5" text-anchor="middle">remote</text>
      <rect x="760" y="222" width="112" height="46" rx="8" fill="#131920" stroke="#8a96a3" stroke-width="1.5"/>
      <text x="816" y="242" fill="#e8ecf1" font-size="12" text-anchor="middle">phone</text>
      <text x="816" y="258" fill="#8a96a3" font-size="10.5" text-anchor="middle">at the cabin</text>

      <!-- radio links -->
      <path d="M136,244 C220,190 300,190 350,224" fill="none" stroke="#3fb47a" stroke-width="2" marker-end="url(#ahg)"/>
      <text x="245" y="196" fill="#3fb47a" font-size="10.5" text-anchor="middle">HaLow · 700 m · window 1</text>
      <path d="M470,220 C520,200 580,140 612,60" fill="none" stroke="#3fb47a" stroke-width="2" marker-end="url(#ahg)"/>
      <text x="548" y="172" fill="#3fb47a" font-size="10.5" text-anchor="middle">HaLow · 750 m</text>
      <text x="548" y="186" fill="#3fb47a" font-size="10.5" text-anchor="middle">window 2</text>
      <path d="M460,88 L606,52" fill="none" stroke="#3fb47a" stroke-width="2" marker-end="url(#ahg)"/>
      <text x="520" y="62" fill="#3fb47a" font-size="10.5" text-anchor="middle">direct · 600 m</text>

      <!-- base to phones -->
      <path d="M688,244 L758,244" fill="none" stroke="#8a96a3" stroke-width="1.5" marker-end="url(#ah)"/>
      <text x="723" y="236" fill="#8a96a3" font-size="10" text-anchor="middle">local Wi-Fi</text>
      <path d="M688,214 C720,200 730,160 758,146" fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#ah)"/>
      <text x="740" y="186" fill="#5c6873" font-size="10" text-anchor="middle">Starlink</text>
      <text x="740" y="199" fill="#5c6873" font-size="10" text-anchor="middle">if present</text>
    </svg>
