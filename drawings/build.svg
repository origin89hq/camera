<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">Camera mesh — from the forest to your phone</title>
  <desc id="description">Concept network, not to scale. Battery camera 09, behind a ridge, sends photos 700 metres to solar relay 08 in wake window 1. The relay keeps them and forwards them 750 metres to the cabin mast in window 2. Camera 01 has a direct 600-metre HaLow link. The cabin base is always on, runs from 12 volts, assigns wake windows, and buffers photos on microSD. A phone at the cabin connects over local Wi-Fi; a remote phone requires the cabin's internet backhaul, such as Starlink. An optional Origin89 controller receives readings only, never photos. The 6–8 metre mast, 1–2 kilometre radius, 5-watt relay panel, and 98 percent camera sleep time are design targets, not measured performance.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
      .ink { fill: #eef1e9; }
      .muted { fill: #a6b5ae; }
      .quiet { fill: #81948a; }
      .green { fill: #9adbb3; }
      .blue { fill: #a5c5ee; }
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size: 14px; letter-spacing: 1.4px; }
      .label { font-size: 23px; font-weight: 600; letter-spacing: -.45px; }
      .body { font-size: 19px; }
      .small { font-size: 17px; }
      .radio { fill: none; stroke: #91d4ab; stroke-width: 3; stroke-linecap: round; marker-end: url(#radio-arrow); }
      .local { fill: none; stroke: #a5c5ee; stroke-width: 2.5; stroke-linecap: round; marker-end: url(#local-arrow); }
      .optional { fill: none; stroke: #a6b5ae; stroke-width: 2; stroke-dasharray: 5 7; stroke-linecap: round; marker-end: url(#optional-arrow); }
      .outline { fill: none; stroke: #a6b5ae; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <linearGradient id="paper" x2="0" y2="1">
      <stop stop-color="#17231f"/><stop offset="1" stop-color="#111b18"/>
    </linearGradient>
    <linearGradient id="ridge" x2="0" y2="1">
      <stop stop-color="#2b3c30"/><stop offset="1" stop-color="#192820"/>
    </linearGradient>
    <linearGradient id="housing" x2="1" y2="1">
      <stop stop-color="#617260"/><stop offset="1" stop-color="#3b4e3e"/>
    </linearGradient>
    <linearGradient id="glass" x2="1" y2="1">
      <stop stop-color="#416c70"/><stop offset=".5" stop-color="#1c383c"/><stop offset="1" stop-color="#0e211f"/>
    </linearGradient>
    <marker id="radio-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#91d4ab" stroke-width="1.5" stroke-linejoin="round"/></marker>
    <marker id="local-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m1 1 8 4-8 4" fill="none" stroke="#a5c5ee" stroke-width="1.5" stroke-linejoin="round"/></marker>
    <marker id="optional-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m1 1 8 4-8 4" fill="none" stroke="#a6b5ae" stroke-width="1.5" stroke-linejoin="round"/></marker>
    <!-- Small, reusable vector components. No raster images or external fonts. -->
    <g id="pine" fill="#2b3c31" stroke="#405145" stroke-width="1.3" stroke-linejoin="round">
      <path d="M0 0v92" fill="none"/><path d="m0 0-17 30h9l-18 28h11l-19 27h68L15 58h11L8 30h9Z"/>
      <path d="M0 13v72" fill="none" opacity=".5"/>
    </g>
    <g id="camera">
      <path d="M31-29V1" stroke="#b4c5b5" stroke-width="4" stroke-linecap="round"/>
      <path d="M4 64v32M58 64v32" stroke="#26372c" stroke-width="5"/>
      <rect x="-3" y="11" width="68" height="42" rx="5" fill="#233629"/>
      <rect width="62" height="78" rx="10" fill="url(#housing)" stroke="#a3b39c" stroke-width="1.5"/>
      <path d="M8 8h46M9 69h44" stroke="#83957b" stroke-width="1.5"/>
      <circle cx="31" cy="29" r="18" fill="#20332a" stroke="#8fa68d" stroke-width="1.5"/>
      <circle cx="31" cy="29" r="12" fill="url(#glass)" stroke="#142922" stroke-width="3"/>
      <circle cx="27" cy="25" r="3.5" fill="#afdcd5" opacity=".6"/>
      <rect x="18" y="54" width="26" height="11" rx="5" fill="#bfccae"/>
      <path d="M24 56v7m7-7v7m7-7v7" stroke="#66795e"/>
      <circle cx="50" cy="12" r="2.4" fill="#a8df9c"/>
    </g>
    <g id="phone">
      <rect width="43" height="75" rx="9" fill="#243b32" stroke="#aec6b5" stroke-width="2"/>
      <rect x="6" y="9" width="31" height="51" rx="4" fill="#12251f"/>
      <path d="M16 5h11m-9 63h7" stroke="#aec6b5" stroke-width="2" stroke-linecap="round"/>
      <rect x="10" y="17" width="23" height="21" rx="3" fill="#547663"/>
      <path d="m12 35 7-9 5 6 3-3 4 6" fill="#aec6a5"/><circle cx="27" cy="22" r="2" fill="#dce1b4"/>
      <path d="M11 45h20m-20 6h14" stroke="#779785" stroke-width="2" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="1600" height="1000" rx="24" fill="url(#paper)"/>
  <rect x=".75" y=".75" width="1598.5" height="998.5" rx="24" fill="none" stroke="#304036" stroke-width="1.5"/>

  <g id="heading">
    <text x="64" y="58" class="mono green">ORIGIN89 / CAMERA MESH</text>
    <text x="64" y="117" class="ink" font-size="46" font-weight="600" letter-spacing="-1.7">From the forest to your phone.</text>
    <text x="64" y="158" class="muted" font-size="21">Battery cameras. Scheduled radio links. Photos stored at the cabin.</text>
    <rect x="1386" y="41" width="150" height="32" rx="16" fill="#26382b" stroke="#465c44"/>
    <circle cx="1406" cy="57" r="3.5" fill="#abc992"/>
    <text x="1462" y="62" text-anchor="middle" class="mono" fill="#c5d5bc" font-size="12">CONCEPT</text>
    <text x="1536" y="147" text-anchor="end" class="mono quiet">SYSTEM OVERVIEW / 01</text>
    <path d="M64 194H1536" stroke="#34463a"/>
  </g>

  <g id="terrain" aria-label="A ridge interrupts the far camera's direct view of the cabin">
    <text x="64" y="230" class="mono muted">01 / IN THE FIELD</text>
    <path d="M64 555C196 515 257 552 341 530s171-52 278-8 207 27 267 21 142-10 208 16V571H64Z" fill="#1c2d24"/>
    <path d="M235 568C290 540 315 459 370 406s92-40 132 5 71 135 128 157Z" fill="url(#ridge)" stroke="#4a5c42" stroke-width="1.5"/>
    <path d="M280 554c69-41 73-138 146-151m-103 155c68-54 74-101 114-114m-36 107c36-36 41-50 76-51m-22 60 38-25" fill="none" stroke="#506047" stroke-width="1.3" opacity=".45"/>
    <use xlink:href="#pine" transform="translate(81 420) scale(.95)" opacity=".7"/>
    <use xlink:href="#pine" transform="translate(226 449) scale(.7)"/>
    <use xlink:href="#pine" transform="translate(317 388) scale(.65)" opacity=".6"/>
    <use xlink:href="#pine" transform="translate(384 351) scale(.45)"/>
    <use xlink:href="#pine" transform="translate(562 457) scale(.75)"/>
    <use xlink:href="#pine" transform="translate(751 427) scale(.9)" opacity=".65"/>
    <use xlink:href="#pine" transform="translate(792 453) scale(.65)"/>
    <path d="M64 570H1104" stroke="#5b6d55" stroke-width="1.5"/>
    <text x="381" y="527" text-anchor="middle" class="small" fill="#c0c9a8">Ridge</text>
    <text x="381" y="550" text-anchor="middle" class="small muted">blocks the direct view</text>
  </g>

  <g id="radio-links" aria-label="Two scheduled hops via the relay, or one direct link">
    <path d="M143 437C217 313 352 273 463 301" class="radio"/>
    <g transform="translate(207 280)">
      <circle cx="13" cy="-6" r="13" fill="#91d4ab"/><text x="13" y="-.5" text-anchor="middle" font-size="16" font-weight="700" fill="#16271d">1</text>
      <text x="37" y="0" class="green body" font-weight="600">700 m · window 1</text>
    </g>
    <path d="M488 301C629 249 790 245 976 274" class="radio"/>
    <g transform="translate(644 230)">
      <circle cx="13" cy="-6" r="13" fill="#91d4ab"/><text x="13" y="-.5" text-anchor="middle" font-size="16" font-weight="700" fill="#16271d">2</text>
      <text x="37" y="0" class="green body" font-weight="600">750 m · window 2</text>
    </g>
    <path d="M664 437C761 377 853 316 976 282" class="radio"/>
    <g transform="translate(697 372)">
      <rect x="-10" y="-22" width="166" height="32" rx="8" fill="#18261f"/>
      <text class="green body" font-weight="600">600 m · direct</text>
    </g>
  </g>

  <g id="far-camera" aria-label="Camera 09: battery powered, behind the ridge">
    <ellipse cx="143" cy="567" rx="48" ry="6" fill="#0c1711" opacity=".6"/>
    <use xlink:href="#camera" x="112" y="468"/>
    <text x="96" y="611" class="label ink">Camera 09</text>
    <text x="96" y="640" class="body muted">Behind the ridge</text>
  </g>

  <g id="solar-relay" aria-label="Relay 08: same board, 5-watt solar panel, store and forward">
    <path d="M474 350v50m-10-1h20" class="outline" stroke="#819877"/>
    <rect x="445" y="330" width="58" height="54" rx="8" fill="url(#housing)" stroke="#a3b39c" stroke-width="1.5"/>
    <path d="M474 305v25" stroke="#b4c5b5" stroke-width="4" stroke-linecap="round"/>
    <path d="M463 308h22" stroke="#b4c5b5" stroke-width="2" stroke-linecap="round"/>
    <circle cx="489" cy="343" r="3" fill="#a8df9c"/>
    <path d="M456 359h21m-21 7h13" stroke="#9fb28e" stroke-width="2" stroke-linecap="round"/>
    <path d="M503 370h40v-27" class="outline" stroke="#75866a"/>
    <g transform="translate(517 320) rotate(-10 28 18)">
      <rect width="58" height="36" rx="3" fill="#203d3b" stroke="#9ab7a1" stroke-width="1.5"/>
      <path d="M19 2v32M38 2v32M2 18h54" stroke="#739a87" stroke-width="1.2"/>
    </g>
    <text x="586" y="343" class="small muted">5 W</text>
    <text x="474" y="435" text-anchor="middle" class="label ink">Relay 08</text>
    <text x="474" y="464" text-anchor="middle" class="body muted">Solar · same board</text>
  </g>

  <g id="near-camera" aria-label="Camera 01: direct line of sight to the mast">
    <ellipse cx="663" cy="567" rx="48" ry="6" fill="#0c1711" opacity=".6"/>
    <use xlink:href="#camera" x="632" y="468"/>
    <text x="622" y="611" class="label ink">Camera 01</text>
    <text x="622" y="640" class="body muted">Mast in sight</text>
  </g>

  <g id="cabin-base" aria-label="Cabin base: HaLow access point, master clock, microSD buffer, 12 volts, always on">
    <text x="1100" y="309" text-anchor="end" class="body ink">6–8 m mast</text>
    <path d="M988 280v159" stroke="#b1c0ad" stroke-width="3"/>
    <path d="M974 284h28m-23-12h18" stroke="#b1c0ad" stroke-width="2" stroke-linecap="round"/>
    <circle cx="988" cy="266" r="5" fill="#a6dfb9"/>
    <path d="M974 258q14-14 28 0m-37-8q23-23 46 0" fill="none" stroke="#7bbb93" stroke-width="1.5" opacity=".5"/>
    <ellipse cx="955" cy="570" rx="120" ry="7" fill="#0c1711" opacity=".65"/>
    <path d="M862 473 952 407 1042 473v94H862Z" fill="#364737" stroke="#8e9f7f" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="m845 472 107-81 107 81-15 10-92-69-92 69Z" fill="#526149" stroke="#9baa8b" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M989 420v-27h21v44" fill="#5d6a50" stroke="#9baa8b" stroke-width="1.5"/>
    <path d="M869 492h80m-80 16h80m-80 16h80m-80 16h80m-80 16h80" stroke="#657658" stroke-width="1"/>
    <rect x="884" y="486" width="39" height="37" rx="2" fill="#c7cfa4" stroke="#9aaa86" stroke-width="2"/>
    <path d="M903 487v35m-17-18h35" stroke="#5d7253" stroke-width="2"/>
    <path d="M988 438v37" stroke="#b1c0ad" stroke-width="2"/>
    <rect x="954" y="477" width="71" height="77" rx="7" fill="#203a2d" stroke="#a1c3a6" stroke-width="2"/>
    <text x="990" y="499" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.5" fill="#d4e2cf">BASE</text>
    <path d="M968 509h44m-44 6h44m-44 6h29" stroke="#658f70" stroke-width="2"/>
    <rect x="968" y="532" width="16" height="10" rx="2" fill="#8fa98c"/>
    <circle cx="1009" cy="538" r="3" fill="#b7e49b"/>
    <text x="861" y="611" class="label ink">Cabin base</text>
    <text x="861" y="640" class="body green">Always on · 12 V</text>
    <text x="861" y="664" class="small muted">1–2 km target radius</text>
  </g>

  <g id="delivery-links" aria-label="The base delivers photos locally, or remotely when an internet connection is present">
    <path d="M1027 503H1063Q1081 503 1081 485V376Q1081 356 1101 356H1163" class="local"/>
    <path d="M1027 523H1068Q1095 523 1111 540H1163" class="optional"/>
    <path d="M1027 546H1050Q1127 546 1127 622V718Q1127 738 1147 738H1163" class="optional"/>
  </g>

  <g id="phone-access">
    <text x="1176" y="230" class="mono muted">02 / AT YOUR PHONE</text>
    <g id="local-access">
      <rect x="1176" y="275" width="360" height="176" rx="16" fill="#20322b" stroke="#405b49"/>
      <use xlink:href="#phone" x="1200" y="302"/>
      <text x="1262" y="315" class="label ink">At the cabin</text>
      <text x="1262" y="344" class="body blue">Local Wi-Fi</text>
      <text x="1200" y="407" class="body muted">Read photos from the base.</text>
      <text x="1200" y="432" class="small muted">Works without internet.</text>
    </g>
    <g id="remote-access">
      <rect x="1176" y="475" width="360" height="176" rx="16" fill="#1a2922" stroke="#3b4e40"/>
      <use xlink:href="#phone" x="1200" y="502"/>
      <text x="1262" y="515" class="label ink">Away from the cabin</text>
      <text x="1262" y="544" class="body muted">Internet backhaul</text>
      <text x="1200" y="607" class="body muted">Uses the cabin’s connection.</text>
      <text x="1200" y="632" class="small muted">For example, Starlink when present.</text>
    </g>
    <g id="optional-controller">
      <rect x="1176" y="679" width="360" height="137" rx="16" fill="none" stroke="#53614f" stroke-dasharray="5 7"/>
      <text x="1200" y="713" class="mono quiet">OPTIONAL INTEGRATION</text>
      <text x="1200" y="746" class="label ink">Origin89 controller</text>
      <text x="1200" y="778" class="body muted">Readings only. No photos.</text>
      <text x="1200" y="801" class="small muted">The camera network works on its own.</text>
    </g>
  </g>

  <g id="how-it-works" aria-label="Capture, forward, keep">
    <path d="M64 682H1083" stroke="#34463a"/>
    <text x="64" y="723" class="mono green">01 / CAPTURE</text>
    <text x="64" y="758" class="body ink">PIR wakes the camera.</text>
    <text x="64" y="787" class="body muted">Capture, queue, then sleep.</text>
    <text x="64" y="816" class="small quiet">Battery · 98% asleep target</text>
    <path d="M383 710v108" stroke="#34463a"/>
    <text x="419" y="723" class="mono green">02 / FORWARD</text>
    <text x="419" y="758" class="body ink">The relay keeps each photo.</text>
    <text x="419" y="787" class="body muted">Receive in 1. Forward in 2.</text>
    <text x="419" y="816" class="small quiet">Scheduled wake windows</text>
    <path d="M742 710v108" stroke="#34463a"/>
    <text x="778" y="723" class="mono green">03 / KEEP</text>
    <text x="778" y="758" class="body ink">The base holds the photos.</text>
    <text x="778" y="787" class="body muted">HaLow AP · clock · microSD</text>
    <text x="778" y="816" class="small quiet">MCU · cloud bridge · 12 V bank</text>
  </g>

  <g id="legend">
    <path d="M64 863H1536" stroke="#34463a"/>
    <path d="M64 902h43" class="radio"/><text x="127" y="909" class="body muted">HaLow radio</text>
    <path d="M350 902h43" class="local"/><text x="413" y="909" class="body muted">Local Wi-Fi</text>
    <path d="M622 902h43" class="optional"/><text x="685" y="909" class="body muted">Optional connection</text>
    <text x="1536" y="908" text-anchor="end" class="mono quiet">STAR FIRST. RELAY WHEN NEEDED.</text>
    <text x="64" y="961" class="small quiet">Concept layout · not to scale. Distances, coverage and power figures are design targets; field validation is pending.</text>
    <text x="1536" y="961" text-anchor="end" class="mono quiet">ORIGIN89</text>
  </g>
</svg>
